trigger:
  branches: 
    include:
      - master
pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: AddClientsTests
    displayName: Run add-clients tests
  
    steps:
      - task: UseNode@1
        inputs:
          version: '20.x'
        displayName: "Use Node.js 20"
     
      - task: CacheBeta@1
        inputs:
          key: npm | package-lock.json
          path: /home/vsts/.npm
          restoreKeys: npm | package-lock.json
      - task: CacheBeta@1
        inputs:
          key: cy | package-lock.json
          path: /home/vsts/.cache/Cypress
          restoreKeys: cy | package-lock.json
      - script: npm ci --verbose --prefer-offline
      - script: npm run cypress:Priority1 -- --ci-build-id $BUILD_BUILDNUMBER
      - script: npx wait-on 'http-get://complytek-testing-hotfix.regtek.co'
        workingDirectory: $(Build.SourcesDirectory)
        env:
          CYPRESS_RECORD_KEY: $(CYPRESS_RECORD_KEY)
     
  - job: OtherTests
    displayName: Run cypress:Priority2 (OtherTests)
    dependsOn: AddClientsTests
#    strategy:
#      parallel: 2
    steps:
      - task: UseNode@1
        inputs:
          version: '20.x'
        displayName: "Use Node.js 20"

      - task: CacheBeta@1
        inputs:
          key: npm | package-lock.json
          path: /home/vsts/.npm
          restoreKeys: npm | package-lock.json
      - task: CacheBeta@1
        inputs:
          key: cy | package-lock.json
          path: /home/vsts/.cache/Cypress
          restoreKeys: cy | package-lock.json
      - script: npm ci --verbose --prefer-offline
      - script: npm run cypress:Priority2 -- --ci-build-id $BUILD_BUILDNUMBER
        displayName: 'Run OtherTests Priority2 tests'
        env:
          CYPRESS_RECORD_KEY: $(CYPRESS_RECORD_KEY)
